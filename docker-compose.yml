version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: migratorx-postgres
    environment:
      POSTGRES_DB: migratorx
      POSTGRES_USER: migratorx
      POSTGRES_PASSWORD: migratorx
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - migratorx-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migratorx"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: migratorx-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - migratorx-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  rabbitmq-data:

networks:
  migratorx-network:
    driver: bridge
