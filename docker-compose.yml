version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: migratorx-postgres
    environment:
      POSTGRES_DB: migratorx
      POSTGRES_USER: migratorx
      POSTGRES_PASSWORD: migratorx123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migration-worker/src/main/resources/db/migration:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migratorx"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: migratorx-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: migratorx
      RABBITMQ_DEFAULT_PASS: migratorx123
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
