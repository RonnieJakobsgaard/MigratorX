spring:
  application:
    name: migration-worker
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/migratorx}
    username: ${SPRING_DATASOURCE_USERNAME:migratorx}
    password: ${SPRING_DATASOURCE_PASSWORD:migratorx}
    driver-class-name: org.postgresql.Driver
  
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1

migrations:
  exchange: ${MIGRATIONS_EXCHANGE:migrations.exchange}
  queue: ${MIGRATIONS_QUEUE:migrations.worker.queue}
  retry:
    queue: ${MIGRATIONS_RETRY_QUEUE:migrations.retry.queue}
    ttl: 30000
  failed:
    queue: ${MIGRATIONS_FAILED_QUEUE:migrations.failed.queue}

migration:
  retry:
    attempts: ${MIGRATION_RETRY_ATTEMPTS:3}
    ttl: 30000

logging:
  level:
    com.example.migratorx.worker: INFO
    org.springframework.amqp: DEBUG
