spring:
  application:
    name: migration-worker
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/migratorx}
    username: ${SPRING_DATASOURCE_USERNAME:migratorx}
    password: ${SPRING_DATASOURCE_PASSWORD:migratorx123}
    driver-class-name: org.postgresql.Driver
  
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:migratorx}
    password: ${SPRING_RABBITMQ_PASSWORD:migratorx123}

# Migration configuration
migrations:
  exchange: ${MIGRATIONS_EXCHANGE:migrations.exchange}
  queue: ${MIGRATIONS_QUEUE:migrations.worker.queue}
  retry:
    queue: ${MIGRATIONS_RETRY_QUEUE:migrations.retry.queue}
  failed:
    queue: ${MIGRATIONS_FAILED_QUEUE:migrations.failed.queue}
  routing:
    key: ${MIGRATIONS_ROUTING_KEY:migrations.request}
  failed:
    routing:
      key: ${MIGRATIONS_FAILED_ROUTING_KEY:migrations.failed}

migration:
  retry:
    attempts: ${MIGRATION_RETRY_ATTEMPTS:3}
    ttl: ${MIGRATION_RETRY_TTL:30000}

# Actuator endpoints (optional, for health checks)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.migratorx.worker: INFO
    org.springframework.amqp: INFO
